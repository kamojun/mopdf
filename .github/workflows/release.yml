# v* タグの push で、署名・公証済みの macOS 版をビルドして下書き Release に添付する。
# 中身は scripts/release_macos.sh をそのまま呼ぶ（ローカルでの配布用ビルドと同じ手順）。
#
# Secrets は Environment "release" に置く（v* タグ限定・手動承認つき）。
#   BUILD_CERTIFICATE_BASE64  Developer ID Application 証明書＋秘密鍵の .p12 を base64 したもの
#   P12_PASSWORD              .p12 書き出し時のパスワード
#   KEYCHAIN_PASSWORD         一時キーチェーン用の任意のランダム文字列
#   NOTARY_API_KEY_BASE64     App Store Connect API キー (.p8) を base64 したもの
#   NOTARY_API_KEY_ID         API キーの Key ID
#   NOTARY_API_ISSUER_ID      API キーの Issuer ID
# 準備手順は docs/DEVELOPMENT.md の「GitHub Actions による自動リリース」を参照。

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: macos-15 # Apple Silicon
    environment: release
    # 初回の公証は Apple 側の詳細解析で長引くことがある
    timeout-minutes: 90
    permissions:
      contents: write # Release の作成

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: 依存パッケージをインストール
        run: pip install -r requirements-dev.txt

      - name: タグからバージョンを決める
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::タグ名は vX.Y.Z 形式にしてください: $GITHUB_REF_NAME"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          # job の env: では runner コンテキストが使えないので、ここで後続ステップに渡す
          echo "KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db" >> "$GITHUB_ENV"

      - name: 署名用の証明書を一時キーチェーンに読み込む
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          CERT_PATH="$RUNNER_TEMP/cert.p12"
          printf '%s' "$BUILD_CERTIFICATE_BASE64" | base64 --decode > "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          # ビルド中に自動ロックされると codesign がGUIの許可ダイアログ待ちで固まるので長めに
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$P12_PASSWORD" -f pkcs12 \
            -k "$KEYCHAIN_PATH" -T /usr/bin/codesign
          rm -f "$CERT_PATH"

          # 書き出した .p12 には中間証明書が入らないので、チェーンを組めるよう入れておく
          # （G1: 2019年以前の証明書 / G2: それ以降）
          for ca in DeveloperIDCA DeveloperIDG2CA; do
            curl -fsSL -o "$RUNNER_TEMP/$ca.cer" "https://www.apple.com/certificateauthority/$ca.cer"
            security import "$RUNNER_TEMP/$ca.cer" -k "$KEYCHAIN_PATH"
          done

          # codesign が許可ダイアログなしで秘密鍵を使えるようにする
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" > /dev/null
          # 検索リストをこの一時キーチェーンにする（release_macos.sh の証明書自動検出が見る）
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

      - name: 公証の認証情報を一時キーチェーンに保存する
        env:
          NOTARY_API_KEY_BASE64: ${{ secrets.NOTARY_API_KEY_BASE64 }}
          NOTARY_API_KEY_ID: ${{ secrets.NOTARY_API_KEY_ID }}
          NOTARY_API_ISSUER_ID: ${{ secrets.NOTARY_API_ISSUER_ID }}
        run: |
          KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          printf '%s' "$NOTARY_API_KEY_BASE64" | base64 --decode > "$KEY_PATH"
          # release_macos.sh は --keychain-profile mopdf-notary で公証するので、同じ名前で保存する
          xcrun notarytool store-credentials mopdf-notary \
            --key "$KEY_PATH" --key-id "$NOTARY_API_KEY_ID" --issuer "$NOTARY_API_ISSUER_ID" \
            --keychain "$KEYCHAIN_PATH"
          rm -f "$KEY_PATH"

      - name: ビルド・署名・公証・検証
        run: MOPDF_NOTARY_KEYCHAIN="$KEYCHAIN_PATH" ./scripts/release_macos.sh "$VERSION"

      - name: 下書き Release を作成
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ZIP="mopdf-v${VERSION}-macos-arm64.zip"
          SHA256="$(shasum -a 256 "dist/$ZIP" | cut -d' ' -f1)"
          cat > "$RUNNER_TEMP/notes.md" <<EOF
          ## ダウンロード

          | ファイル | 対象 |
          | --- | --- |
          | \`$ZIP\` | Apple Silicon搭載Mac（M1以降） |

          zipを展開して \`mopdf.app\` を「アプリケーション」フォルダへ移動してください。

          ## 変更点

          - （ここに書く）

          ## チェックサム

          \`\`\`
          SHA-256  $SHA256  $ZIP
          \`\`\`

          ## ライセンス

          [AGPL-3.0](https://github.com/${GITHUB_REPOSITORY}/blob/main/LICENSE)
          EOF
          gh release create "$GITHUB_REF_NAME" "dist/$ZIP" \
            --draft --verify-tag --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md"

      - name: 一時キーチェーンを削除
        if: always()
        run: |
          if [ -n "${KEYCHAIN_PATH:-}" ]; then
            security delete-keychain "$KEYCHAIN_PATH" 2>/dev/null || true
          fi
          rm -f "$RUNNER_TEMP/cert.p12" "$RUNNER_TEMP/AuthKey.p8"
